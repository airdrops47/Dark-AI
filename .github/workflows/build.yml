name: build

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Toolchain to build"
        type: choice
        options: [none, node, python, rust, go, java]
        default: none
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(format('["{0}"]', inputs.stack || 'none')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report free disk before
        run: df -h / | tail -1

      # ---------------------------------------------------------------
      # Toolchains. Built-in action caching is deliberately NOT used:
      # setup-python/setup-node/setup-go abort when the lockfile is
      # absent, which is exactly the state of a fresh repo. Caching is
      # done below with explicit hashFiles guards instead.
      # ---------------------------------------------------------------

      - name: Setup Node
        if: matrix.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        if: matrix.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        if: matrix.stack == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: matrix.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Java
        if: matrix.stack == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------------
      # Caches, each guarded so an empty repo never fails here.
      # ---------------------------------------------------------------

      - name: Cache npm
        if: matrix.stack == 'node' && hashFiles('package-lock.json') != ''
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache pip
        if: matrix.stack == 'python' && hashFiles('requirements*.txt', 'pyproject.toml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache Rust
        if: matrix.stack == 'rust' && hashFiles('Cargo.lock') != ''
        uses: Swatinem/rust-cache@v2

      - name: Cache Go
        if: matrix.stack == 'go' && hashFiles('go.sum') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Cache Gradle
        if: matrix.stack == 'java' && hashFiles('gradle/wrapper/gradle-wrapper.properties') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------------------------------------------------------------
      # Install and build. Every branch degrades to a clean no-op.
      # ---------------------------------------------------------------

      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.stack }}" in
            node)
              if [ -f package-lock.json ]; then npm ci
              elif [ -f package.json ]; then npm install
              else echo "no package.json, skipping"; fi ;;
            python)
              if [ -f requirements.txt ]; then pip install -r requirements.txt
              elif [ -f pyproject.toml ]; then pip install -e .
              else echo "no python manifest, skipping"; fi ;;
            rust)
              if [ -f Cargo.toml ]; then cargo fetch --locked 2>/dev/null || cargo fetch
              else echo "no Cargo.toml, skipping"; fi ;;
            go)
              if [ -f go.mod ]; then go mod download
              else echo "no go.mod, skipping"; fi ;;
            java)
              if [ -f gradlew ]; then chmod +x gradlew
              else echo "no gradle wrapper, skipping"; fi ;;
            none)
              echo "stack=none, nothing to install" ;;
          esac

      - name: Build and test
        run: |
          set -euo pipefail
          case "${{ matrix.stack }}" in
            node)
              if [ -f package.json ]; then
                npm run build --if-present
                npm test --if-present
              else echo "nothing to build"; fi ;;
            python)
              if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -f setup.py ]; then
                python -m pytest -q
              else echo "nothing to build"; fi ;;
            rust)
              if [ -f Cargo.toml ]; then
                cargo build --locked --verbose
                cargo test --locked --verbose
              else echo "nothing to build"; fi ;;
            go)
              if [ -f go.mod ]; then
                go build ./...
                go test ./...
              else echo "nothing to build"; fi ;;
            java)
              if [ -f gradlew ]; then ./gradlew --no-daemon build
              else echo "nothing to build"; fi ;;
            none)
              echo "smoke run: repo reachable, toolchain not requested" ;;
          esac

      - name: Report free disk after
        run: df -h / | tail -1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.stack }}-${{ github.run_number }}
          path: |
            dist/
            build/
            target/debug/
            *.log
          if-no-files-found: ignore
          retention-days: 7
