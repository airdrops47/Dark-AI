name: build

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Toolchain to build"
        type: choice
        options: [none, node, python, rust, go, java]
        default: none
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(format('["{0}"]', inputs.stack || 'none')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report free disk before
        run: df -h / | tail -1

      # ---------- toolchains (each is a no-op when not selected) ----------

      - name: Setup Node
        if: matrix.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        if: matrix.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Setup Rust
        if: matrix.stack == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: matrix.stack == 'rust'
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        if: matrix.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Setup Java
        if: matrix.stack == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------- install (skips cleanly if there is no manifest) ----------

      - name: Install dependencies
        run: |
          set -euo pipefail
          case "${{ matrix.stack }}" in
            node)
              if [ -f package-lock.json ]; then npm ci
              elif [ -f package.json ]; then npm install
              else echo "no package.json, skipping"; fi ;;
            python)
              if [ -f requirements.txt ]; then pip install -r requirements.txt
              elif [ -f pyproject.toml ]; then pip install -e .
              else echo "no python manifest, skipping"; fi ;;
            rust)
              if [ -f Cargo.toml ]; then cargo fetch
              else echo "no Cargo.toml, skipping"; fi ;;
            go)
              if [ -f go.mod ]; then go mod download
              else echo "no go.mod, skipping"; fi ;;
            java)
              if [ -f gradlew ]; then chmod +x gradlew
              else echo "no gradle wrapper, skipping"; fi ;;
            none)
              echo "stack=none, nothing to install" ;;
          esac

      # ---------- build + test ----------

      - name: Build and test
        run: |
          set -euo pipefail
          case "${{ matrix.stack }}" in
            node)
              if [ -f package.json ]; then
                npm run build --if-present
                npm test --if-present
              else echo "nothing to build"; fi ;;
            python)
              python -m pytest -q || { echo "pytest failed or not present"; [ -f pytest.ini ] && exit 1 || exit 0; } ;;
            rust)
              if [ -f Cargo.toml ]; then cargo build --locked --verbose; cargo test --locked --verbose
              else echo "nothing to build"; fi ;;
            go)
              if [ -f go.mod ]; then go build ./...; go test ./...
              else echo "nothing to build"; fi ;;
            java)
              if [ -f gradlew ]; then ./gradlew --no-daemon build
              else echo "nothing to build"; fi ;;
            none)
              echo "smoke run: repository reachable, toolchain not requested" ;;
          esac

      - name: Report free disk after
        run: df -h / | tail -1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.stack }}-${{ github.run_number }}
          path: |
            dist/
            build/
            target/debug/
            *.log
          if-no-files-found: ignore
          retention-days: 7
